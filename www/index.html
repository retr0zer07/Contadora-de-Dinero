<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Contadora de Dinero</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Contadora</h1>
      <p class="stats"><span id="statPieces">0</span> piezas · <span id="statBills">0</span> billetes · <span id="statCoins">0</span> monedas</p>
    </div>
    <div class="total-box">
      <span>Total</span>
      <strong id="grandTotal">$0.00</strong>
    </div>
  </header>

  <main>
    <!-- Contar -->
    <section id="view-count" class="view active">
      <ul id="countList" class="denoms"></ul>
      <p id="countEmpty" class="empty hidden">No hay denominaciones visibles. Actívalas en la pestaña <b>Denominaciones</b>.</p>
      <div class="card actions">
        <input id="countName" type="text" placeholder="Nombre o nota (opcional)" maxlength="60">
        <div class="row">
          <button id="btnClear" class="btn secondary">Limpiar</button>
          <button id="btnSave" class="btn primary">Guardar en historial</button>
        </div>
      </div>
    </section>

    <!-- Historial -->
    <section id="view-history" class="view">
      <div class="section-head">
        <h2>Historial</h2>
        <button id="btnClearHistory" class="btn danger small">Borrar todo</button>
      </div>
      <ul id="historyList" class="history"></ul>
      <p id="historyEmpty" class="empty">Aún no hay cuentas guardadas.</p>
    </section>

    <!-- Denominaciones -->
    <section id="view-denoms" class="view">
      <div class="card">
        <h2>Moneda</h2>
        <label class="field">
          <span>Símbolo</span>
          <input id="symbolInput" type="text" maxlength="4" placeholder="$">
        </label>
      </div>

      <form id="addForm" class="card">
        <h2>Nueva denominación</h2>
        <div class="row">
          <input id="newValue" type="number" inputmode="decimal" min="0.01" step="any" placeholder="Valor (ej. 20000)" required>
          <select id="newType">
            <option value="billete">Billete</option>
            <option value="moneda">Moneda</option>
          </select>
        </div>
        <button type="submit" class="btn primary full">Agregar</button>
      </form>

      <div class="card">
        <div class="section-head">
          <h2>Visibles al contar</h2>
          <button id="btnReset" class="btn secondary small">Restaurar</button>
        </div>
        <ul id="denomList" class="denom-config"></ul>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="count">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z M7 12a5 5 0 0 0 10 0a5 5 0 0 0-10 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Contar
    </button>
    <button class="tab" data-view="history">
      <svg viewBox="0 0 24 24"><path d="M12 7v5l3 3 M3 12a9 9 0 1 0 3-6.7L3 8 M3 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Historial
    </button>
    <button class="tab" data-view="denoms">
      <svg viewBox="0 0 24 24"><path d="M4 6h16 M4 12h16 M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Denominaciones
    </button>
  </nav>

  <dialog id="detailDialog">
    <div class="dialog-body">
      <h3 id="detailTitle"></h3>
      <p id="detailDate" class="muted"></p>
      <div class="detail-table-wrap">
        <table class="detail-table">
          <thead><tr><th>Denom.</th><th>Cant.</th><th>Subtotal</th></tr></thead>
          <tbody id="detailRows"></tbody>
          <tfoot><tr><th>Total</th><th id="detailPieces"></th><th id="detailTotal"></th></tr></tfoot>
        </table>
      </div>
      <div class="row">
        <button id="btnDetailDelete" class="btn danger">Eliminar</button>
        <button id="btnDetailLoad" class="btn secondary">Cargar</button>
        <button id="btnDetailClose" class="btn primary">Cerrar</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
